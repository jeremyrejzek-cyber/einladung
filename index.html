<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Date Einladung ❤️</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      text-align: center;
      max-width: 450px;
      width: 100%;
      position: relative;
      transition: all 0.3s ease;
    }

    .heart-icon {
      font-size: 50px;
      margin-bottom: 15px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    h1 {
      color: #d63384;
      font-size: 26px;
      margin-bottom: 25px;
      line-height: 1.3;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 80px;
      position: relative;
      margin-top: 10px;
    }

    .btn {
      padding: 14px 32px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }

    .btn-yes {
      background-color: #ff4757;
      color: white;
      box-shadow: 0 8px 15px rgba(255, 71, 87, 0.4);
      z-index: 10;
    }

    .btn-yes:hover {
      background-color: #ff6b81;
      transform: scale(1.08);
    }

    .btn-no {
      background-color: #747d8c;
      color: white;
      box-shadow: 0 8px 15px rgba(116, 125, 140, 0.3);
      position: absolute;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .date-form {
      display: none;
      margin-top: 20px;
      text-align: left;
      animation: fadeIn 0.5s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input[type="date"], select {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #ffccd5;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      background-color: #fff;
      color: #333;
      transition: border-color 0.3s ease;
    }

    input[type="date"]:focus, select:focus {
      border-color: #ff4757;
    }

    .submit-btn {
      width: 100%;
      background-color: #2ed573;
      color: white;
      margin-top: 10px;
      box-shadow: 0 8px 15px rgba(46, 213, 115, 0.3);
    }

    .submit-btn:hover {
      background-color: #26af5f;
    }

    .success-message {
      display: none;
      animation: fadeIn 0.5s ease forwards;
    }

    .success-message h2 {
      color: #ff4757;
      margin-bottom: 10px;
    }

    .success-message p {
      color: #555;
      font-size: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <div id="step1">
      <div class="heart-icon">💖</div>
      <h1>Hey, willst du auf ein Date mit mir gehen?</h1>
      
      <div class="btn-container" id="btnContainer">
        <button class="btn btn-yes" onclick="showForm()">Ja!</button>
        <button class="btn btn-no" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">Nein</button>
      </div>
    </div>

    <div class="date-form" id="step2">
      <div class="heart-icon">🎉</div>
      <h1 style="font-size: 22px;">Juhu! Wann hast du Zeit?</h1>
      
      <form id="appointmentForm" onsubmit="submitForm(event)">
        <div class="form-group">
          <label for="date">Wann hast du Zeit?</label>
          <input type="date" id="date" required>
        </div>

        <div class="form-group">
          <label for="time">Was würdest du gerne machen?</label>
          <select id="time" required>
            <option value="" disabled selected>Bitte Aktivität wählen!</option>
            <option value="12:00">Ein Mittagessen mit einen Sonnenuntergangsspaziergang (ca. 15 Uhr)</option>
            <option value="15:00">Ausflug in ein nettes Kaffee (ca. 14 Uhr)</option>
            <option value="18:00">Arbendessen und ein Kaltgetränk (ca. 18:30 Uhr)</option>
            <option value="20:00">Ein gemütlicher Spielenachmittag (ca. 17 Uhr)</option>
          </select>
        </div>

        <button type="submit" class="btn submit-btn">Termin bestätigen ❤️</button>
      </form>
    </div>

    <div class="success-message" id="step3">
      <div class="heart-icon">🥰</div>
      <h2>Perfekt! Ich freue mich auf dich!</h2>
      <p id="summaryText"></p>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const btnContainer = document.getElementById('btnContainer');

    // Position des Nein-Buttons initial festlegen
    window.onload = () => {
      noBtn.style.position = 'relative';
    };

    function moveButton() {
      const card = document.getElementById('card');
      const cardRect = card.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      // Berechne zufällige Position innerhalb der Karte
      const maxX = cardRect.width - btnRect.width - 40;
      const maxY = cardRect.height - btnRect.height - 40;

      const randomX = Math.floor(Math.random() * maxX) - (cardRect.width / 2 - btnRect.width);
      const randomY = Math.floor(Math.random() * maxY) - (cardRect.height / 2 - btnRect.height);

      noBtn.style.position = 'absolute';
      noBtn.style.left = `${Math.max(20, Math.min(cardRect.width - 120, randomX + cardRect.width / 2))}px`;
      noBtn.style.top = `${Math.max(20, Math.min(cardRect.height - 60, randomY + cardRect.height / 2))}px`;
    }

    function showForm() {
      // Konfetti-Effekt abfeuern
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });

      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';

      // Mindestdatum auf heute setzen
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('date').setAttribute('min', today);
    }

    function submitForm(event) {
      event.preventDefault();

      const selectedDate = document.getElementById('date').value;
      const selectedTime = document.getElementById('time').value;

      // Datum schön formatieren (DD.MM.YYYY)
      const dateParts = selectedDate.split('-');
      const formattedDate = `${dateParts[2]}.${dateParts[1]}.${dateParts[0]}`;

      document.getElementById('step2').style.display = 'none';
      document.getElementById('step3').style.display = 'block';

      document.getElementById('summaryText').innerHTML = 
        `Unser Date steht am <strong>${formattedDate}</strong> um <strong>${selectedTime} Uhr</strong>.<br><br>Mach einen Screenshot davon und schick ihn mir! 😉`;

      // Noch mehr Konfetti!
      confetti({
        particleCount: 150,
        spread: 100,
        origin: { y: 0.6 }
      });
    }
  </script>
</body>
</html>
